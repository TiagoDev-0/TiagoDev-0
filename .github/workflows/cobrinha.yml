name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TiagoSantos9

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%237C3AED&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%23a78bfa,%237C3AED

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%2316102B,%23312252,%235B21B6,%237C3AED,%23A855F7

      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
